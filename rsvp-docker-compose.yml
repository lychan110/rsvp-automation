# Standalone docker-compose for RSVP Automation.
# Test this independently with: docker compose -f rsvp-docker-compose.yml up --build
# Integrate into rolodex/docker-compose.yml by copying the `rsvp-automation` service block.

services:
  rsvp-automation:
    build:
      context: ./rsvp-automation
      dockerfile: Dockerfile
      args:
        - VITE_APP_VERSION=5.1.0
    ports:
      - "5176:80"
    restart: unless-stopped
    # API keys: set in .env or pass via --env-file
    # NOT via 'environment:' below — those are visible in `docker inspect`
    # Instead use --env-file or mount: ~/.rsvp/.env:/rsvp/.env:ro
    env_file:
      - ~/.rsvp-automation.env