name: rolodex

services:
  rsvp-automation:
    container_name: rsvp-automation
    build: .
    ports:
      - "5176:5173"
    networks:
      - webapps
    restart: unless-stopped
    # Use env_file for API keys — 'environment:' entries are visible in `docker inspect`
    env_file:
      - ~/.rsvp-automation.env

networks:
  webapps:
    name: webapps
    external: true